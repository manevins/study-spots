<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Space IC - Iowa City Study Spots</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            /* Palette Swatch Colors */
            --homebody: #F49F51;
            --tequila-sunrise: #FFD4E5;
            --spring-water: #BEE4E7;
            --tropical-breeze: #95C7C2;
            --flamingo-pink: #F490B9;
            --florence: #F7CCAD;

            --primary-dark: #1F2937;
            --text-main: #2C3E50;
            --card-bg: #FFFFFF;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.7;
            color: var(--text-main);
            background-color: #FAF8F5;
            /* SVG Polka Dot Pattern */
            background-image: radial-gradient(#95C7C2 1.5px, transparent 1.5px), radial-gradient(#F49F51 1.5px, #FAF8F5 1.5px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3 {
            font-family: 'Outfit', sans-serif;
        }

        .disclaimer-banner {
            background-color: var(--primary-dark);
            color: var(--florence);
            text-align: center;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            border-bottom: 3px solid var(--homebody);
        }

        header {
            background-color: var(--card-bg);
            padding: 60px 20px 45px;
            text-align: center;
            border-bottom: 2px solid var(--florence);
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        header .header-badge {
            display: inline-block;
            background-color: var(--spring-water);
            color: var(--primary-dark);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 800;
            margin-bottom: 16px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        header h1 {
            color: var(--primary-dark);
            font-size: clamp(2.8rem, 6vw, 4.8rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: 14px;
        }

        header h1 span {
            color: var(--homebody);
        }

        header p {
            font-size: 1.25rem;
            color: var(--primary-dark);
            max-width: 700px;
            margin: 0 auto;
            font-weight: 600;
        }

        nav {
            background-color: var(--primary-dark);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        nav li {
            width: 100%;
            text-align: center;
        }

        @media (min-width: 600px) {
            nav li {
                width: auto;
            }
        }

        nav a {
            display: block;
            padding: 18px 28px;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.02em;
            transition: all 0.2s ease;
        }

        nav a:hover, nav a.active {
            color: var(--primary-dark);
            background-color: var(--homebody);
        }

        main {
            max-width: 1200px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .hero {
            background-color: var(--card-bg);
            padding: 50px;
            border-radius: var(--radius-lg);
            border: 3px solid var(--florence);
            margin-bottom: 35px;
            box-shadow: var(--shadow-sm);
        }

        .hero h2 {
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--primary-dark);
            letter-spacing: -0.02em;
        }

        .hero p {
            color: var(--primary-dark);
            font-size: 1.15rem;
            line-height: 1.8;
            font-weight: 500;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 35px;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: var(--radius-lg);
            border: 3px solid var(--spring-water);
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

            box-shadow: var
